<div id="app">
  <header id="top">
    <div class="logo"><b>YORU</b> TŌGE <span>夜峠</span></div>
    <div class="topnews" id="tNews"></div>
    <div class="stats">
      <div class="stat money"><small>Pénz</small><strong id="stMoney">¥ 0</strong></div>
      <div class="stat"><small>Rep</small><strong id="stRep">0</strong></div>
      <div class="stat"><small>Nap</small><strong id="stDay">1</strong></div>
      <button class="iconbtn" id="btnSettings" aria-label="Beállítások">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="screen" id="scr-garage">
      <canvas id="garageCv"></canvas>
      <div class="g-over g-top">
        <div class="carplate"><div class="n" id="gCarName"></div><div class="s" id="gCarSpec"></div><div class="wxl" id="gWx"></div><div class="nw" id="gNews"></div></div>
      </div>
      <div class="g-over g-bottom">
        <div class="g-left">
          <div class="row">
            <button class="btn" id="btnWalk">Belső nézet <small>3D</small></button>
            <button class="btn" id="btnDecor">Berendezés</button>
            <span class="decor-hint" id="decorHint" hidden>Koppints egy kiemelt helyre</span>
          </div>
        </div>
        <div class="row">
          <button class="btn ghost" id="btnPrevCar" hidden>◀</button>
          <button class="btn ghost" id="btnNextCar" hidden>▶</button>
          <button class="btn primary" id="btnSleep">Alvás · következő nap</button>
        </div>
      </div>
    </section>
    <section class="screen pad" id="scr-car" hidden><div class="wrap" id="carWrap"></div></section>
    <section class="screen" id="scr-shop" hidden style="overflow:hidden"><div class="magwrap" id="shopWrap"></div></section>
    <section class="screen pad" id="scr-tune" hidden><div class="wrap" id="tuneWrap"></div></section>
    <section class="screen pad" id="scr-dyno" hidden><div class="wrap" id="dynoWrap"></div></section>
    <section class="screen pad" id="scr-work" hidden><div class="wrap" id="workWrap"></div></section>
    <section class="screen pad" id="scr-touge" hidden><div class="wrap" id="tougeWrap"></div></section>
  </main>

  <nav id="nav" aria-label="Fő menü">
    <button data-scr="garage" aria-current="true"><span class="jp">車庫</span><span class="hu">Garázs</span></button>
    <button data-scr="car"><span class="jp">整備</span><span class="hu">Szerelés</span><span class="badge" id="badgeInv" hidden>0</span></button>
    <button data-scr="shop"><span class="jp">部品</span><span class="hu">Bolt</span></button>
    <button data-scr="tune"><span class="jp">調整</span><span class="hu">Tuning</span></button>
    <button data-scr="dyno"><span class="jp">測定</span><span class="hu">Dyno</span></button>
    <button data-scr="work"><span class="jp">仕事</span><span class="hu">Munka</span></button>
    <button data-scr="touge"><span class="jp">峠</span><span class="hu">Touge</span></button>
  </nav>
</div>

<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>
<div id="race" hidden></div>
<div id="walk" hidden></div>
